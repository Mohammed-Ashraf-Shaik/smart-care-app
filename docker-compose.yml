version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: smartcare-postgres
    restart: always
    environment:
      POSTGRES_USER: smartcare
      POSTGRES_PASSWORD: smartcare_dev_password
      POSTGRES_DB: smartcare_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: smartcare-redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data:
