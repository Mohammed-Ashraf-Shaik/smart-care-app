<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a3b69">
    <meta name="description" content="SmartCare makes finding care and joining a hospital queue simpler.">
    <script>
        (() => {
            const repositoryPath = '/smart-care-app';
            const hostname = window.location.hostname;
            const currentPath = window.location.pathname || '/';
            const isGitHubPages = hostname.endsWith('.github.io') &&
                (currentPath === repositoryPath || currentPath.startsWith(`${repositoryPath}/`));
            const basePath = isGitHubPages ? `${repositoryPath}/` : '/';
            const base = document.createElement('base');
            base.href = basePath;
            document.head.prepend(base);
            window.SMARTCARE_BASE_PATH = isGitHubPages ? repositoryPath : '';
            const recoveredPath = new URLSearchParams(window.location.search).get('smartcare_path');
            if (isGitHubPages && recoveredPath) {
                const target = new URL(recoveredPath, window.location.origin);
                const logicalPath = target.pathname.startsWith(repositoryPath) ? target.pathname.slice(repositoryPath.length) || '/' : target.pathname || '/';
                window.history.replaceState({}, '', `${repositoryPath}${logicalPath === '/' ? '/' : logicalPath}${target.search}${target.hash}`);
            }

            // Theme hydration to avoid flicker
            try {
                const savedTheme = localStorage.getItem('smartcare.theme') || 'light';
                document.documentElement.setAttribute('data-theme', savedTheme);
            } catch {}
        })();

        function googleTranslateElementInit() {
            if (window.google && window.google.translate) {
                new window.google.translate.TranslateElement({
                    pageLanguage: 'en',
                    includedLanguages: 'en,hi,te,ta,bn,mr,es',
                    autoDisplay: false
                }, 'google_translate_element');
            }
        }
    </script>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <title>SmartCare | Care, without the waiting room</title>

    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.12.0/dist/maplibre-gl.css">
    <script src="https://unpkg.com/maplibre-gl@5.12.0/dist/maplibre-gl.js"></script>
    <script src="https://unpkg.com/qrcode-generator@1.4.4/qrcode.js"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" async defer></script>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <a href="#app" class="skip-link">Skip to main content</a>
    <div id="google_translate_element" style="display:none"></div>
    <div id="app" aria-live="polite"></div>

    <script type="module" src="js/main.js"></script>
</body>

</html>
